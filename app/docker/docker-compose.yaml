# Hermes Agent Desktop —— fnOS 容器编排
#
# 本文件由 fnOS 应用中心依据 config/resource 里的 docker-project 资源声明托管：
#   "docker-project": { "projects": [ { "name": "hermes-agent", "path": "docker" } ] }
# 应用中心自己执行 docker compose up / down；cmd/main 的 start/stop 只是幂等兜底。
#
# ── 交付形态：官方 Desktop Webapp（不是简化 Dashboard）────────────────────
#   Hermes Desktop 的 Electron 壳只是包装，真正的 UI 是一个纯 Web bundle：
#     /opt/hermes/apps/desktop/dist-webapp   （assets 1060 个，47 MB）
#   对比简化的 Dashboard 渲染层：
#     /opt/hermes/hermes_cli/web_dist        （assets 46 个，3.2 MB）
#
#   上游为此专门提供了 webapp 形态（hermes_cli/webapp_launcher.py 首行：
#   "hermes webapp: open the browser-hosted Desktop that the gateway serves."）。
#   gateway 的 webapp_listener 会把该 bundle 挂到 dashboard 的 HTTP 服务上，
#   与官方 Windows / macOS Desktop 共用同一套 UI 代码，仅承载方式不同。
#
#   上游官方环境变量（hermes_cli/webapp.py 确认）：
#     DIST_ENV = "HERMES_WEBAPP_DIST"
#     webapp_dist_dir() = packaged_webapp_dist() or <project_root>/apps/desktop/dist-webapp
#   注释原文：a packaged bundle, like HERMES_WEB_DIST for the dashboard — the
#   packager builds it, so Hermes serves it as it is and never builds or marks it.
#   → 指向镜像内既有路径，Hermes 直接伺服，绝不运行时自建（那需要 Node 26 与源码）。
#
# ── 为什么 gateway 与 webapp 合用一个容器 ──────────────────────────────────
#   上游推荐形态：command: gateway run。
#   webapp 与 dashboard 共用 gateway 的同一个 HTTP/WebSocket 栈
#   （webapp_listener 挂在 dashboard 的 HTTP listener 上），因此：
#     · 只有一个写者 → SQLite（state.db，WAL 模式）不会损坏；
#     · 容器崩了 s6 整体拉起，gateway 与 webapp 一起恢复。
#   若拆成两个容器，两个进程会并发写同一个数据目录 —— 上游明确不推荐。
#
# ── env_file 的两个关键参数（真机 E5 实测确认，缺一不可）────────────────
#   required: false
#       fnOS 在 install_callback 之前就会加载并校验 compose 项目。
#       若 env_file 指向的文件不存在，加载直接失败 → 安装报 10266 中断。
#   format: raw
#       默认 compose 会对 env 文件的值做变量插值：
#         KEY=pa$word → 展开成 pa（$word 被当未定义变量丢掉）
#       format: raw 关闭插值，值按字面量进容器。
#       代价：值不能用引号包裹，脚本写 env 文件时一律写裸值。
#
# ── 端口 ─────────────────────────────────────────────────────────────────
#   9121 = Desktop Webapp 入口（manifest service_port / app/ui/config 三处一致）
#   8642 = OpenAI 兼容 API（可选，由向导开关）

# ⚠️ 不要在这里写顶层 `name:` 字段。
#   真机 E5 实测：带 `name: hermes-agent` 时，fnOS 应用中心执行 compose 命令
#   会把工作目录解析成 `/docker/` → 报
#     exit status 1: open /docker/docker-compose.yaml: no such file or directory
#   去掉后 fnOS 用 resource 里 docker-project 的 path 定位到
#   /vol1/@appcenter/<appname>/docker —— 与已跑通的参考实现一致。
#   项目名由 fnOS 用 appname 决定（compose 自动取目录名的上一级或 -p 参数）。

services:
  hermes-agent:
    # ── 镜像 tag ──────────────────────────────────────────────────────────
    #   默认 main-desktop：**唯一**自带 Desktop 渲染层的变体。
    #
    #   真机逐个镜像进容器查文件实测（e5，2026-11-02）：
    #     docker run --rm --entrypoint sh <img> -c \
    #       'ls /opt/hermes/apps/desktop/dist-webapp/assets | wc -l'
    #
    #     main-desktop            → 1060 assets ✅   ✓ webapp.py
    #                                            ✓ webapp_launcher.py
    #                                            ✓ gateway/webapp_listener.py
    #     v0.22.5-desktop         → MISSING  ❌   三个 .py 全缺
    #     latest-desktop          → MISSING  ❌   三个 .py 全缺（与上者同 digest）
    #     v0.22.5 / stable (slim) → MISSING  ❌   且无 hermes_cli/gateway 目录
    #
    #   ⚠️ **tag 名带 -desktop 不代表带 Desktop 渲染层** —— 这是本项目最大的坑：
    #      v0.22.5-desktop 实测不含 dist-webapp，也不含 Desktop 特性的三个 .py。
    #      装上去容器能起、端口能响应，但页面是官方简化 Dashboard（46 assets），
    #      而不是 Desktop 工作区（1060 assets）—— **静默失败**。
    #
    #   ⚠️ 也不能用「同 digest」或「体积差」推断：
    #      v0.22.5-desktop 与 latest-desktop 同 digest，只能说明两者指向同一镜像；
    #      体积 main-desktop 3.75GB vs v0.22.5-desktop 3.59GB，差 163MB 来自
    #      tools/.venv 等依赖，与渲染层（47MB）无关。
    #      唯一可靠的判断依据：进镜像查文件。
    #
    #   代价：main-desktop 是浮动 tag，上游重建会带来行为漂移。
    #   需要内容不可变时改用摘要锁定（install_init / install_callback 已支持
    #   @sha256: 形式，跳过 version 对齐校验）：
    #     nousresearch/hermes-agent@sha256:b8c18a42fae9d70db32be9116a52bde7c99ebae0c16c6b6e172f2b9d732b201d
    image: ${HERMES_DOCKER_IMAGE_REPO:-nousresearch/hermes-agent}:${HERMES_DOCKER_IMAGE_TAG:-main-desktop}
    # pull_policy: missing —— 本地有这个 tag 就直接用，**不去 registry 拉 manifest**。
    #
    # 为什么需要（真机 E5 实测，2026-11-03）：
    #   默认策略在本地缺镜像时会尝试联网拉取，而 NAS 访问 Docker Hub 经常超时：
    #     Get "https://registry-1.docker.io/v2/": net/http: request canceled
    #     while waiting for connection (Client.Timeout exceeded while awaiting headers)
    #   → 安装界面长时间停在 "Pulling fs layer / Waiting"，最后 compose up 失败。
    #   配合 cmd/install_callback 的三级降级（本地有 → 限时拉 → 回退本地 desktop 镜像），
    #   这里再钉死 "missing"：回退后 compose 绝不联网，用的必然是本地那份。
    pull_policy: missing
    container_name: ${HERMES_DOCKER_CONTAINER:-hermes-agent}
    restart: unless-stopped

    command:
      - gateway
      - run

    # 宿主网络：容器内端口 == 宿主端口。
    # 理由：① 官方 compose 示例即 network_mode: host；
    #       ② Agent 的沙箱子进程要访问宿主上的推理服务时，127.0.0.1 即宿主；
    #       ③ Webapp(9121) 与 OpenAI 兼容 API(8642) 都由容器直接占住宿主端口，
    #          不会出现「映射端口与容器端口错位」。
    network_mode: host

    # 随安装变化的配置（端口 / 账号 / 密钥 / uid / gid）全部走这里。
    env_file:
      - path: /var/apps/hermes-agent/var/config.env
        required: false
        format: raw

    # 固定不变的结构性配置。
    environment:
      # ⚠️ 关键规则：compose 的 `environment` 会**覆盖** `env_file` 的同名键。
      #    所以同一个键只能出现在一个地方 —— 全部随安装变化的量都放 env_file
      #    （var/config.env），这里只放 env_file 里没有的静态量。
      #    两边都写的话，以这里为准，症状是「配置写了但没生效」。
      #
      # 端口 / 绑定地址 / 账号 / 密钥 / uid / gid / 渲染层路径 / CORS
      # 全部由 cmd/install_callback 写进 var/config.env：
      #   HERMES_DASHBOARD_HOST=0.0.0.0    绑定地址（非回环 → 强制 Basic Auth）
      #   HERMES_DASHBOARD_PORT=9121        端口（= service_port = ui/config port）
      #   HERMES_WEBAPP_DIST=<渲染层路径>   Desktop 渲染层（上游正式环境变量）
      #   API_SERVER_HOST=0.0.0.0          OpenAI 兼容 API（局域网可达，靠 KEY 保护）
      #
      #   ⚠️ Desktop Webapp 与 Dashboard **共用同一个 listener、同一个端口**。
      #   源码依据（gateway/webapp_listener.py）：
      #     def listener_plan(home) -> tuple[str, int, WebappMount | None, str | None]:
      #         settings = webapp_settings(home)
      #         if not settings.enabled: return (*settings.bind, None, settings.reason)
      #         mount = WebappMount(dist=webapp_dist_dir(get_project_root()), ...)
      #         return (*settings.bind, mount, None)
      #   即：host/port 取自 **config.yaml 的 webapp: 段**，Desktop 渲染层作为
      #   mount 挂在同一个 listener 上。webapp 关闭时挂载点为 None（只剩简化面板）。
      #   → 所以对外只有一个端口 9121；Desktop 是否挂载由 config.yaml 的
      #     webapp.enabled 决定（见 cmd/install_callback 生成的 config.yaml）。
      HERMES_TIMEZONE: "Asia/Shanghai"

    volumes:
      # 全部持久状态：会话 / 记忆 / skills / cron / config.yaml / .env / state.db
      # 放在 shares/<appname>/data —— 卸载保留、升级不丢、系统自动授权 ACL，
      # 且用户在「文件管理」里能直接看到自己的 Agent 数据（可查看/备份/迁移）。
      # 不放 var/：那是应用私有区，用户看不见；也不放 home/：卸载保留清单不含它。
      - "${HERMES_DATA_HOST:-/var/apps/hermes-agent/shares/hermes-agent/data}:/opt/data"
      # 用户投放给 Agent 处理的工作区（data-share 声明的 workspace）
      - "${HERMES_WORKSPACE_HOST:-/var/apps/hermes-agent/shares/hermes-agent/workspace}:/opt/workspace"

    # NAS 上给个内存上限，避免吃满整机
    # 内存上限。值来自向导 wizard_memory_limit，由 cmd/install_callback 写进
    # 同目录 .env（compose 的插值通道 —— mem_limit 是编排级字段，
    # 服务的 env_file 通道对它无效）。
    # 单位由本行的 m 提供 → target/docker/.env 里只存纯数字（如 3072）。
    # ⚠️ .env 里若存 3072m 会插值成 3072mm → compose 加载失败。
    mem_limit: ${HERMES_DOCKER_MEMORY:-3072}m

    # SQLite WAL 落盘 + 会话落盘需要时间，给足优雅停机窗口
    stop_grace_period: 30s
